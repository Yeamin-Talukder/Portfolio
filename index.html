<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yeamin Talukder — Developer & Competitive Programmer</title>
    <meta name="description" content="Portfolio of Md. Yeamin Talukder — CSE student, competitive programmer, and software developer at the University of Barishal.">
    <meta name="theme-color" content="#05060f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="Yeamin Talukder — Developer & Competitive Programmer">
    <meta property="og:description" content="CSE student, competitive programmer, and software developer at the University of Barishal.">
    <meta property="og:image" content="img/avater.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="img/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Preloader -->
    <div class="preloader" id="preloader" aria-hidden="true">
        <div class="loader-system">
            <span class="loader-sun"></span>
            <span class="loader-orbit"><i></i></span>
            <span class="loader-orbit loader-orbit-2"><i></i></span>
        </div>
        <p class="loader-text">Launching</p>
    </div>

    <!-- Space background -->
    <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
    <div class="nebula" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Desktop navigation -->
    <header class="topnav" id="topnav">
        <a href="#home" class="brand" id="brand" data-nav="home">
            <span class="brand-mark"><i></i></span>
            <span class="brand-text" id="brandText">YEAMIN</span>
        </a>
        <nav class="topnav-links" id="topnavLinks" aria-label="Primary"></nav>
        <a href="#" class="btn btn-primary btn-sm" id="navResume" download>
            <i class="fas fa-download"></i><span>Resume</span>
        </a>
    </header>

    <!-- Mobile app bar -->
    <header class="appbar" id="appbar">
        <button class="appbar-avatar" id="appbarAvatar" aria-label="Home">
            <img src="" alt="" id="appbarAvatarImg">
        </button>
        <div class="appbar-titles">
            <span class="appbar-kicker" id="appbarKicker">Portfolio</span>
            <span class="appbar-title" id="appbarTitle">Home</span>
        </div>
        <a href="#" class="appbar-action" id="appbarResume" aria-label="Download resume" download>
            <i class="fas fa-arrow-down"></i>
        </a>
    </header>

    <main id="app"></main>

    <footer class="site-footer" id="footer"></footer>

    <!-- Mobile tab bar -->
    <nav class="tabbar" id="tabbar" aria-label="App navigation"></nav>

    <!-- Mobile "More" bottom sheet -->
    <div class="sheet" id="moreSheet" aria-hidden="true">
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" role="dialog" aria-label="More">
            <div class="sheet-handle" data-close></div>
            <div class="sheet-body" id="moreSheetBody"></div>
        </div>
    </div>

    <button class="to-top" id="toTop" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript><p style="padding:2rem;color:#fff">This portfolio needs JavaScript enabled to render.</p></noscript>

    <script src="data/content.js"></script>
    <script src="js/starfield.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
